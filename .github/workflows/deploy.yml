name: Deploy to Cloudflare Pages

on:
  pull_request:
    types:
      - closed  # Se ejecuta cuando el PR se cierra (incluye merges)
    branches:
      - main   # Solo para PRs dirigidos a main
  workflow_dispatch: # Permite ejecutarlo manualmente desde la UI de GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci # Usa 'ci' para instalaciones rápidas y confiables en CI

      - name: Build Vite App
        run: npm run build # El comando de build de Vite

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          command: pages deploy dist --project-name=frontend-practice